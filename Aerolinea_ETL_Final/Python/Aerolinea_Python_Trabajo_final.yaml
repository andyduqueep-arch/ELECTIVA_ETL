resources:
  jobs:
    Aerolinea_Python_Trabajo_final:
      name: Aerolinea_Python_Trabajo final
      email_notifications:
        on_start:
          - andyduqueep@gmail.com
        on_success:
          - andyduqueep@gmail.com
        on_failure:
          - andyduqueep@gmail.com
      tasks:
        - task_key: bronze_ingestion_py
          spark_python_task:
            python_file: /Workspace/Users/andyduqueep@gmail.com/ARQUITECTURA_AEROLINEA_TRABAJO
              FINAL/Python/bronze_ingestion.py
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          environment_key: Default
        - task_key: silver_transform_py
          depends_on:
            - task_key: bronze_ingestion_py
          spark_python_task:
            python_file: /Workspace/Users/andyduqueep@gmail.com/ARQUITECTURA_AEROLINEA_TRABAJO
              FINAL/Python/silver_transform.py
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          environment_key: Default
        - task_key: gold_analytics_py
          depends_on:
            - task_key: silver_transform_py
          spark_python_task:
            python_file: /Workspace/Users/andyduqueep@gmail.com/ARQUITECTURA_AEROLINEA_TRABAJO
              FINAL/Python/gold_analytics.py
          max_retries: 2
          min_retry_interval_millis: 60000
          retry_on_timeout: true
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED
